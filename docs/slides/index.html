<p class="kicker">1 · The problem</p>

## A catalogue is only as good as its picks

<div class="cols wide-right">
<div>

- **Pick**: arrival time of a P or S wave at one station
- Picks → **locations** → magnitudes → *physics* (faults, fluids, magma)
- Manual picking: minutes per event, hours per day of data
- Aluto 2012–14: **2,393 events** located by hand (Yemane et al.)
- Small events are skipped: the catalogue is **incomplete** below some magnitude

</div>

<p class="kicker">2 · Traditional pickers</p>

## STA/LTA: watch the energy jump

<div class="cols wide-right">
<div>

<span class="formula">R(t) = STA(t) / LTA(t)</span>

- Short-term average (≈0.5 s) over long-term average (≈10 s) of signal energy
- Trigger when *R* > on-threshold; reset when *R* < off-threshold
- Coincidence over several stations → **detection**
- <span class="good">Fast, transparent, no training</span>
- <span class="bad">Onset time is imprecise; S hard; noise bursts trigger too</span>

</div>
<div>
<img class="fig" src="figures/stalta.png" alt="STA/LTA" onerror="this.outerHTML='<div class=fig-missing>Real-data figure appears after<br><code>python scripts/make_slide_figures.py</code></div>'">
</div>
</div>

<a href="https://doi.org/10.1785/BSSA0880010095">Withers et al. (1998) BSSA</a> ·
<a href="https://docs.obspy.org/tutorial/code_snippets/trigger_tutorial.html">ObsPy trigger tutorial</a></div>

<p class="kicker">2 · Traditional pickers</p>

## Refining the onset, and detecting by similarity

<div class="cols">
<div class="card">

### Onset refinement

- **AIC picker**: split the window where two "noise + signal" models fit best
- **Kurtosis / higher-order statistics**: impulsive onsets break Gaussianity
- Used after an STA/LTA trigger for a precise time

</div>
<div class="card">

### Template matching

- Cross-correlate known events with continuous data
- Finds events **10× smaller** than STA/LTA
- <span class="bad">Only finds events similar to the templates</span>

</div>
</div>

<p class="small" style="margin-top:.6em"><strong>Common limits:</strong> per-site tuning, emergent onsets (volcanic LP events), S phases in P coda, overlapping events.</p>

<div class="refs">Maeda (1985) Zisin ·
<a href="https://doi.org/10.1785/0120120347">Baillard et al. (2014) BSSA</a> ·
<a href="https://doi.org/10.1111/j.1365-246X.2006.02865.x">Gibbons & Ringdal (2006) GJI</a></div>

Note:
These are still widely used, and they are the baseline any ML method has to beat.
Template matching is powerful but needs templates and is limited to repeating sources.

<p class="kicker">3 · Deep learning</p>

## Picking as a learned probability

<div class="cols">
<div>

<div class="net"><span class="box">3-comp. window</span><span class="arrow">➜</span><span class="box hot">neural network</span><span class="arrow">➜</span><span class="box">P(t), S(t), noise(t)</span></div>

- **PhaseNet**: U-Net, 30 s windows, probability per sample
- **EQTransformer**: CNN + LSTM + **attention**, 60 s, detection + P + S
- Picks = peaks above a **threshold** (a choice, not a fact)
- Trained on **millions** of analyst picks (STEAD, INSTANCE, …)

</div>
<div>
<img class="fig" src="figures/probabilities.png" alt="Model probabilities" onerror="this.outerHTML='<div class=fig-missing>Real-data figure appears after<br><code>python scripts/make_slide_figures.py</code></div>'">
<p class="tiny">Three models on the same Aluto record. Dashed: analyst picks.</p>
</div>
</div>

<div class="refs"><a href="https://doi.org/10.1093/gji/ggy423">Zhu & Beroza (2019) GJI</a> ·
<a href="https://doi.org/10.1038/s41467-020-17591-w">Mousavi et al. (2020) Nat. Commun.</a> ·
<a href="https://doi.org/10.1785/0120180080">Ross et al. (2018) BSSA</a> ·
<a href="https://doi.org/10.1109/ACCESS.2019.2947848">STEAD</a> ·
<a href="https://doi.org/10.5194/essd-13-5509-2021">INSTANCE</a></div>

Note:
PhaseNet treats picking like image segmentation. EQTransformer adds attention, which helps with long context.
Key point: the output is a probability curve; the threshold and post-processing are ours.

<p class="kicker">3 · Deep learning</p>

## A model knows its training data

- **Domain shift**: different noise, instruments, sampling, source types ⇒ worse picks
- **Calibration** differs: 0.3 for one model ≠ 0.3 for another
- More picks ≠ better: false picks feed false events
- Benchmarks show **no single best model**: performance depends on the data set used for training *and* testing

<div class="card small" style="margin-top:.6em">

**Rule for today:** never trust a picker on new data until you have compared it with **analyst picks** on that data. Notebook 04 does exactly that for Aluto.

</div>

<div class="refs"><a href="https://doi.org/10.1029/2021JB023499">Münchmeyer et al. (2022) "Which picker fits my data?" JGR</a> ·
<a href="https://doi.org/10.1126/science.abm4470">Mousavi & Beroza (2022) Science</a></div>

Note:
This is the most important slide for an expert audience. The benchmark paper trained every model on every dataset and tested across them.

<p class="kicker">5 · Volcanoes</p>

## Why volcanic seismicity is different, and VolPick

<div class="cols">
<div>

- **VT** events: brittle failure, like tectonic quakes but shallow and small
- **LP** events: fluid-driven, **0.5–5 Hz**, emergent, weak S
- Strong scattering in altered rock and hydrothermal systems
- General-purpose pickers **degrade as frequency content drops**

</div>
<div class="card">

### VolPick

- PhaseNet and EQTransformer retrained on **VCSEIS**: VT, LP and regular events plus noise from volcanic regions
- Better on data never used in training (Cascadia volcanoes, Nankai low-frequency earthquakes)
- `PhaseNet.from_pretrained("volpick")`
- <a href="https://github.com/zhong-yy/volpick">github.com/zhong-yy/volpick</a>

</div>
</div>

<div class="refs"><a href="https://doi.org/10.1029/2024GL108438">Zhong & Tan (2024) GRL</a> ·
<a href="https://doi.org/10.1038/380309a0">Chouet (1996) Nature</a></div>

Note:
Aluto is another out-of-sample test: geothermal, rift, mostly shallow VT-like events.
Our question for today: does VolPick beat the general-purpose weights here?
